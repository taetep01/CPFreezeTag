<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CP Freezetag — Multiplayer Freeze Tag Game</title>
    <meta name="description" content="CP Freezetag — A 2-4 player online freeze tag game with power-ups, built with Phaser.js and Colyseus." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #080e2a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', Arial, sans-serif;
        overflow: hidden;
      }
      #app canvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 0 60px rgba(79,195,247,0.35), 0 0 20px rgba(79,195,247,0.2);
      }
      /* HTML input overlays styled by JS */
      input { font-family: 'Outfit', monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
